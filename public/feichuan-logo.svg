<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
<!-- folder body with corner cut out for transparent fold reveal -->
<!-- main body: left portion full height -->
<rect x="4" y="8" width="19" height="20" fill="#F2F0E5"/>
<!-- right portion below fold area -->
<rect x="23" y="17" width="3" height="11" fill="#F2F0E5"/>
<!-- right portion between fold bottom and fold start -->
<rect x="23" y="11" width="2" height="6" fill="#F2F0E5"/>
<rect x="23" y="9" width="1" height="2" fill="#F2F0E5"/>
<!-- folder tab -->
<rect x="4" y="6" width="9" height="2" fill="#F2F0E5"/>
<rect x="13" y="6" width="2" height="1" fill="#CECDC3"/>
<!-- top fold line -->
<rect x="4" y="8" width="22" height="1" fill="#DAD8CE"/>
<!-- staircase crease line -->
<rect x="20" y="8" width="1" height="1" fill="#6F6E69"/>
<rect x="21" y="9" width="1" height="2" fill="#6F6E69"/>
<rect x="22" y="11" width="1" height="6" fill="#6F6E69"/>
<!-- fold back surface -->
<rect x="21" y="8" width="2" height="1" fill="#9F9D96"/>
<rect x="22" y="9" width="1" height="2" fill="#9F9D96"/>
<!-- shadow under fold -->
<rect x="22" y="17" width="4" height="1" fill="#343331"/>
<!-- FC scattered brush: F pixels (dark) -->
<rect x="7" y="12" width="1" height="1" fill="#403E3C"/>
<rect x="7" y="14" width="1" height="1" fill="#403E3C"/>
<rect x="7" y="16" width="1" height="1" fill="#575653"/>
<rect x="7" y="18" width="1" height="1" fill="#403E3C"/>
<rect x="8" y="12" width="1" height="1" fill="#575653"/>
<rect x="9" y="12" width="1" height="1" fill="#6F6E69"/>
<rect x="8" y="15" width="1" height="1" fill="#575653"/>
<rect x="9" y="15" width="1" height="1" fill="#6F6E69"/>
<!-- FC scattered brush: C pixels (light) -->
<rect x="12" y="12" width="1" height="1" fill="#9F9D96"/>
<rect x="13" y="12" width="1" height="1" fill="#B7B5AC"/>
<rect x="14" y="12" width="1" height="1" fill="#CECDC3"/>
<rect x="12" y="14" width="1" height="1" fill="#B7B5AC"/>
<rect x="12" y="16" width="1" height="1" fill="#9F9D96"/>
<rect x="12" y="18" width="1" height="1" fill="#B7B5AC"/>
<rect x="13" y="18" width="1" height="1" fill="#CECDC3"/>
<rect x="14" y="18" width="1" height="1" fill="#DAD8CE"/>
<!-- color debris -->
<rect x="27" y="6" width="1" height="1" fill="#DA702C"/>
<rect x="28" y="5" width="1" height="1" fill="#4385BE"/>
<rect x="26" y="4" width="1" height="1" fill="#879A39"/>
<rect x="29" y="7" width="1" height="1" fill="#CE5D97"/>
<rect x="27" y="3" width="1" height="1" fill="#D0A215"/>
</svg>
