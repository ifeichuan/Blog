<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layered Parallax Clouds</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #081b2b;
        color: #eef4f5;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      #stage {
        position: relative;
        width: min(100vw, 177.78vh);
        aspect-ratio: 16 / 9;
        overflow: hidden;
        isolation: isolate;
        background: #081b2b;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.32);
      }

      .clip,
      .camera,
      .photo-layer,
      .veil,
      .label,
      .focus-ring {
        position: absolute;
        inset: 0;
      }

      .camera {
        transform-origin: 44% 54%;
        will-change: transform;
      }

      .photo-layer {
        left: -12%;
        top: -14%;
        width: 124%;
        height: 132%;
        background-image: url("./source-cloud.png");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: var(--pos-x, 50%) var(--pos-y, 56%);
        opacity: var(--opacity, 1);
        filter: var(--filter, none);
        will-change: transform, opacity, filter;
        transform: translate3d(calc(var(--mx, 0px) + var(--dx, 0px)), calc(var(--my, 0px) + var(--dy, 0px)), 0) scale(var(--scale, 1));
      }

      .sky {
        --pos-y: 22%;
        --opacity: 0.96;
        --filter: saturate(1.08) contrast(1.05);
        mask-image: linear-gradient(180deg, #000 0 44%, transparent 72%);
      }

      .far {
        --pos-y: 48%;
        --scale: 1.03;
        --opacity: 0.72;
        --filter: blur(2.4px) saturate(0.92) brightness(1.08);
        mask-image: linear-gradient(180deg, transparent 0 27%, #000 38% 61%, transparent 74%);
      }

      .mid {
        --pos-y: 58%;
        --scale: 1.08;
        --opacity: 0.86;
        --filter: blur(0.8px) saturate(1.02) contrast(1.04);
        mask-image: linear-gradient(180deg, transparent 0 37%, #000 48% 78%, transparent 91%);
      }

      .near {
        --pos-y: 70%;
        --scale: 1.15;
        --opacity: 0.98;
        --filter: saturate(1.08) contrast(1.08) brightness(0.98);
        mask-image: linear-gradient(180deg, transparent 0 55%, #000 67% 100%);
      }

      .warm-edge {
        --pos-x: 56%;
        --pos-y: 76%;
        --scale: 1.2;
        --opacity: 0.34;
        --filter: blur(7px) sepia(0.28) saturate(1.3) brightness(1.05);
        mix-blend-mode: soft-light;
        mask-image: radial-gradient(ellipse at 62% 88%, #000 0 42%, transparent 68%);
      }

      .veil {
        pointer-events: none;
        background:
          radial-gradient(circle at 58% 22%, rgba(255, 228, 186, 0.2), transparent 23%),
          linear-gradient(90deg, rgba(6, 21, 34, 0.35), transparent 26%, transparent 73%, rgba(7, 18, 27, 0.25)),
          linear-gradient(180deg, rgba(2, 10, 18, 0.16), transparent 42%, rgba(251, 183, 113, 0.16));
        mix-blend-mode: multiply;
      }

      .grain {
        opacity: 0.1;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      .focus-ring {
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(circle at 44% 54%, transparent 0 22%, rgba(5, 16, 27, 0.36) 58%, rgba(5, 16, 27, 0.74) 100%);
        mix-blend-mode: multiply;
      }

      .label {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 4.4% 5%;
        pointer-events: none;
      }

      .label h1 {
        margin: 0;
        max-width: 10em;
        font-size: clamp(28px, 4.1vw, 74px);
        line-height: 0.96;
        letter-spacing: 0;
        color: rgba(242, 248, 247, 0.88);
        text-shadow: 0 3px 18px rgba(4, 14, 23, 0.32);
      }

      .label p {
        margin: 0 0 0.45rem;
        max-width: 24em;
        font-size: clamp(12px, 1vw, 17px);
        line-height: 1.55;
        color: rgba(238, 244, 245, 0.68);
        text-align: right;
      }

      @media (prefers-reduced-motion: reduce) {
        .camera,
        .photo-layer { transform: none !important; }
      }
    </style>
  </head>
  <body>
    <main data-hf-id="hf-sa21" id="stage" data-composition-id="layered-parallax-clouds" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <section id="cloud-scene" data-hf-id="hf-diff" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <div class="camera" data-hf-id="hf-camera">
          <div data-hf-id="hf-0tf2" class="photo-layer sky" data-depth="0.08"></div>
          <div data-hf-id="hf-t9gm" class="photo-layer far" data-depth="0.22"></div>
          <div data-hf-id="hf-q7n2" class="photo-layer mid" data-depth="0.52"></div>
          <div data-hf-id="hf-sxaj" class="photo-layer near" data-depth="0.88"></div>
          <div data-hf-id="hf-eywo" class="photo-layer warm-edge" data-depth="1.12"></div>
          <div data-hf-id="hf-h5f4" class="veil"></div>
          <div data-hf-id="hf-7zpl" class="veil grain"></div>
        </div>
        <div class="focus-ring" data-hf-id="hf-focus-ring"></div>
        <div data-hf-id="hf-x0aa" class="label">
          <h1 data-hf-id="hf-rngz">Layered<br data-hf-id="hf-x5px" />Parallax<br data-hf-id="hf-rsrt" />Clouds</h1>
          <p data-hf-id="hf-orps">Scroll pushes the camera through painted depth layers.</p>
        </div>
      </section>
    </main>

    <script>
      window.__timelines = window.__timelines || {};
      const root = document.getElementById("stage");
      const layers = [...root.querySelectorAll(".photo-layer[data-depth]")];
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function clamp(value) {
        return Math.max(0, Math.min(1, Number(value) || 0));
      }

      function setParallax(x, y) {
        if (reduce) return;
        layers.forEach((layer) => {
          const depth = Number(layer.dataset.depth || 0);
          layer.style.setProperty("--mx", `${x * depth * 28}px`);
          layer.style.setProperty("--my", `${y * depth * 16}px`);
        });
      }

      root.addEventListener("pointermove", (event) => {
        const rect = root.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width - 0.5;
        const y = (event.clientY - rect.top) / rect.height - 0.5;
        setParallax(x, y);
      });

      const tl = gsap.timeline({ paused: true });
      tl.from(".label h1", { y: 26, opacity: 0, duration: 1.1, ease: "power3.out" }, 0.2)
        .from(".label p", { y: 18, opacity: 0, duration: 0.9, ease: "power3.out" }, 0.45)
        .to(".label", { opacity: 0, y: -30, duration: 2.4, ease: "power2.in" }, 2.2)
        .to(".camera", { scale: 1.86, xPercent: -8.5, yPercent: -11.5, duration: 12, ease: "none" }, 0)
        .to(".sky", { "--dx": "-12px", "--dy": "-5px", duration: 12, ease: "none" }, 0)
        .to(".far", { "--dx": "-48px", "--dy": "-17px", duration: 12, ease: "none" }, 0)
        .to(".mid", { "--dx": "62px", "--dy": "-42px", duration: 12, ease: "none" }, 0)
        .to(".near", { "--dx": "-112px", "--dy": "-86px", "--scale": 1.32, duration: 12, ease: "none" }, 0)
        .to(".warm-edge", { "--dx": "98px", "--dy": "-54px", "--scale": 1.42, opacity: 0.52, duration: 12, ease: "none" }, 0)
        .to(".focus-ring", { opacity: 0.85, duration: 12, ease: "none" }, 0)
        .to("#stage", { filter: "saturate(1.12) contrast(1.08)", duration: 12, ease: "none" }, 0);
      window.__timelines["layered-parallax-clouds"] = tl;

      function setCloudScrollProgress(progress) {
        tl.progress(clamp(progress)).pause();
      }

      window.setCloudScrollProgress = setCloudScrollProgress;
      window.addEventListener("message", (event) => {
        if (event.data?.type === "cloud-scroll-progress") {
          setCloudScrollProgress(event.data.progress);
        }
      });

      if (!window.__HYPERFRAMES__) {
        if (window.parent === window) {
          tl.play(0);
        } else {
          setCloudScrollProgress(0);
        }
      }
    </script>
  </body>
</html>
