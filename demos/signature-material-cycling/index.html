<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signature Material Cycling</title>
    <style>
      :root {
        --ink-mask: url("../../feichuan-signature.svg");
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --paper: oklch(89% 0.038 83);
        --soil: oklch(34% 0.043 67);
        --moss: oklch(48% 0.055 135);
        --sun: oklch(86% 0.116 86);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
        color: var(--soil);
        background:
          radial-gradient(ellipse at 19% 24%, oklch(97% 0.05 96 / 0.62), transparent 31%),
          radial-gradient(ellipse at 78% 20%, oklch(64% 0.07 148 / 0.22), transparent 34%),
          linear-gradient(145deg, var(--paper), oklch(76% 0.055 80));
        font-family: ui-serif, Georgia, "Times New Roman", serif;
      }

      body::before,
      body::after {
        position: fixed;
        inset: -12%;
        content: "";
        pointer-events: none;
      }

      body::before {
        background:
          radial-gradient(ellipse 18% 12% at 23% 28%, oklch(95% 0.13 92 / 0.48), transparent 68%),
          radial-gradient(ellipse 14% 10% at 55% 46%, oklch(94% 0.08 96 / 0.34), transparent 70%),
          radial-gradient(ellipse 26% 19% at 78% 22%, oklch(52% 0.06 128 / 0.18), transparent 76%);
        filter: blur(13px);
        mix-blend-mode: multiply;
        animation: dapple 12s ease-in-out infinite alternate;
      }

      body::after {
        opacity: 0.28;
        background-image:
          linear-gradient(oklch(32% 0.04 124 / 0.08) 1px, transparent 1px),
          linear-gradient(90deg, oklch(32% 0.04 124 / 0.07) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(circle at 50% 48%, black 0 44%, transparent 76%);
      }

      main {
        position: relative;
        z-index: 1;
        display: grid;
        min-height: 100vh;
        grid-template-rows: auto 1fr auto;
        padding: clamp(22px, 4vw, 58px);
      }

      header,
      footer {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: clamp(0.72rem, 1.2vw, 0.88rem);
        letter-spacing: 0;
        color: oklch(32% 0.04 72 / 0.72);
      }

      header strong {
        font-weight: 650;
      }

      .stage {
        display: grid;
        place-items: center;
        min-height: 0;
      }

      .signature {
        position: relative;
        width: min(84vw, 1120px);
        aspect-ratio: 850 / 334;
        isolation: isolate;
        contain: layout paint style;
        filter: drop-shadow(0 24px 42px oklch(33% 0.04 74 / 0.16));
      }

      .base-ink {
        position: absolute;
        inset: 0;
        opacity: 0.62;
        background:
          linear-gradient(90deg, oklch(33% 0.046 62 / 0.45), oklch(23% 0.04 56 / 0.86)),
          repeating-linear-gradient(9deg, oklch(100% 0 0 / 0.14) 0 1px, transparent 1px 5px);
        mask: var(--ink-mask) center / contain no-repeat;
        -webkit-mask: var(--ink-mask) center / contain no-repeat;
        filter: drop-shadow(0 2px 0 oklch(100% 0 0 / 0.22));
      }

      .material-window {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        filter: drop-shadow(0 0 16px oklch(100% 0 0 / 0.36));
      }

      .layer {
        position: absolute;
        inset: 0;
        opacity: 0;
        clip-path: inset(0 calc(100% - var(--scan-end, 36%)) 0 var(--scan-start, 0%));
        mask: var(--ink-mask) center / contain no-repeat;
        -webkit-mask: var(--ink-mask) center / contain no-repeat;
      }

      .signature[data-material="glass"] .material-glass,
      .signature[data-material="extrude"] .material-3d,
      .signature[data-material="chalk"] .material-chalk,
      .signature[data-material="paint"] .material-paint {
        opacity: 0.98;
      }

      .layer::before,
      .layer::after {
        position: absolute;
        inset: -12%;
        content: "";
      }

      .material-glass {
        filter:
          url("#liquid-glass")
          drop-shadow(1.5px 0 0 oklch(64% 0.21 30 / 0.48))
          drop-shadow(-1.5px 0 0 oklch(68% 0.2 244 / 0.52))
          drop-shadow(0 0 18px oklch(98% 0.02 102 / 0.82));
        backdrop-filter: blur(18px) saturate(1.35);
      }

      .material-glass::before {
        background:
          linear-gradient(112deg, transparent 12%, oklch(100% 0 0 / 0.92) 28%, transparent 39%),
          radial-gradient(ellipse at 56% 36%, oklch(100% 0 0 / 0.78), transparent 38%),
          linear-gradient(180deg, oklch(100% 0 0 / 0.62), oklch(76% 0.1 205 / 0.52));
        transform: translateX(-16%);
        animation: sheen 6.4s linear infinite;
      }

      .material-3d {
        transform: translate(2px, -1px);
        filter:
          drop-shadow(3px 4px 0 oklch(28% 0.045 60 / 0.28))
          drop-shadow(9px 12px 0 oklch(24% 0.04 58 / 0.14))
          drop-shadow(-1px -1px 0 oklch(99% 0.018 93 / 0.8));
      }

      .material-3d::before {
        background:
          linear-gradient(135deg, oklch(96% 0.045 82), oklch(54% 0.12 58) 46%, oklch(22% 0.07 42)),
          repeating-linear-gradient(135deg, transparent 0 10px, oklch(100% 0 0 / 0.34) 11px 12px);
      }

      .material-chalk {
        filter: url("#chalk-noise") drop-shadow(0 2px 0 oklch(100% 0 0 / 0.28));
      }

      .material-chalk::before {
        background:
          repeating-radial-gradient(circle at 18% 28%, oklch(98% 0.01 95 / 0.72) 0 1px, transparent 1px 4px),
          repeating-linear-gradient(8deg, oklch(100% 0 0 / 0.92) 0 2px, transparent 2px 7px),
          oklch(99% 0.01 96 / 0.98);
        opacity: 1;
      }

      .material-paint {
        filter: url("#paint-edge") drop-shadow(0 8px 18px oklch(31% 0.08 34 / 0.2));
      }

      .material-paint::before {
        background:
          radial-gradient(circle at 19% 48%, oklch(52% 0.24 28), transparent 26%),
          radial-gradient(circle at 51% 44%, oklch(76% 0.2 74), transparent 28%),
          radial-gradient(circle at 78% 54%, oklch(47% 0.18 148), transparent 30%),
          linear-gradient(92deg, oklch(48% 0.23 31), oklch(75% 0.19 82), oklch(43% 0.17 154));
        animation: paint-flow 6.4s ease-in-out infinite;
      }

      .material-paint::after {
        background:
          radial-gradient(circle at 31% 82%, oklch(42% 0.12 28 / 0.42) 0 3px, transparent 4px),
          radial-gradient(circle at 67% 80%, oklch(44% 0.11 132 / 0.34) 0 4px, transparent 5px);
        background-size: 82px 42px, 108px 50px;
        filter: blur(0.4px);
      }

      .cut-flash {
        position: absolute;
        inset: -6%;
        z-index: 4;
        pointer-events: none;
        opacity: 0;
        mask: var(--ink-mask) center / contain no-repeat;
        -webkit-mask: var(--ink-mask) center / contain no-repeat;
        background:
          linear-gradient(90deg, transparent 0 47%, oklch(100% 0 0 / 0.88) 49% 50%, transparent 52%),
          linear-gradient(90deg, transparent 0 45%, oklch(70% 0.2 31 / 0.42) 47%, transparent 51%),
          linear-gradient(90deg, transparent 0 50%, oklch(70% 0.18 246 / 0.42) 52%, transparent 56%);
        mix-blend-mode: screen;
        filter: blur(0.2px);
        transition: opacity 40ms linear;
        transform: translateX(var(--flash-x, 0%)) scaleX(0.65);
      }

      .signature.is-cutting .cut-flash {
        opacity: 0.9;
      }

      .spark {
        position: absolute;
        top: 31%;
        left: 0;
        z-index: 4;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: oklch(100% 0 0 / 0.92);
        box-shadow:
          0 0 18px oklch(95% 0.11 93 / 0.9),
          0 0 38px oklch(76% 0.16 84 / 0.42);
        transform: translateX(var(--spark-x, 0%));
      }

      .labels {
        position: absolute;
        right: clamp(12px, 4vw, 42px);
        bottom: -36px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 0.72rem;
      }

      .labels span {
        padding: 6px 8px;
        border: 1px solid oklch(34% 0.04 72 / 0.18);
        background: oklch(96% 0.028 88 / 0.52);
        color: oklch(33% 0.04 72 / 0.7);
      }

      footer {
        align-items: end;
      }

      footer p {
        max-width: 44ch;
        margin: 0;
        text-align: right;
      }

      @keyframes sheen {
        0% {
          transform: translateX(-48%) rotate(-8deg);
        }
        100% {
          transform: translateX(46%) rotate(-8deg);
        }
      }

      @keyframes paint-flow {
        0%,
        100% {
          transform: translateX(-3%) scale(1.04);
        }
        50% {
          transform: translateX(4%) scale(1.06);
        }
      }

      @keyframes dapple {
        from {
          transform: rotate(-7deg) translate3d(-2%, -1%, 0) scale(1.02);
        }
        to {
          transform: rotate(-2deg) translate3d(2%, 1%, 0) scale(1.05);
        }
      }

      @media (max-width: 760px) {
        body {
          overflow: auto;
        }

        main {
          min-height: 100svh;
          gap: 26px;
        }

        header,
        footer {
          display: grid;
        }

        footer p {
          text-align: left;
        }

        .signature {
          width: 94vw;
        }

        .labels {
          bottom: -52px;
          left: 4px;
          right: auto;
          justify-content: flex-start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }

        .material-glass {
          opacity: 1;
        }

        .material-window,
        .spark {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="liquid-glass" x="-15%" y="-30%" width="130%" height="160%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.014 0.048" numOctaves="2" seed="8" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="B" />
        <feGaussianBlur stdDeviation="0.28" />
      </filter>
      <filter id="chalk-noise" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="3" result="grain" />
        <feDisplacementMap in="SourceGraphic" in2="grain" scale="2.8" xChannelSelector="R" yChannelSelector="G" />
        <feGaussianBlur stdDeviation="0.18" />
      </filter>
      <filter id="paint-edge" x="-12%" y="-24%" width="124%" height="148%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.022 0.075" numOctaves="3" seed="12" result="paint" />
        <feDisplacementMap in="SourceGraphic" in2="paint" scale="6" xChannelSelector="R" yChannelSelector="B" />
      </filter>
    </svg>

    <main>
      <header>
        <strong>Feichuan SVG material cycling</strong>
        <span>glass / extrude / chalk / paint</span>
      </header>

      <section class="stage" aria-label="SVG 签名材质循环动画">
        <div class="signature" data-material="glass">
          <div class="base-ink"></div>
          <div class="material-window">
            <div class="layer material-glass"></div>
            <div class="layer material-3d"></div>
            <div class="layer material-chalk"></div>
            <div class="layer material-paint"></div>
          </div>
          <div class="cut-flash"></div>
          <div class="spark"></div>
          <div class="labels" aria-hidden="true">
            <span>refractive glass</span>
            <span>beveled 3d</span>
            <span>chalk grain</span>
            <span>wet paint</span>
          </div>
        </div>
      </section>

      <footer>
        <span>source: feichuan-signature.svg</span>
        <p>Same SVG silhouette. Only material layers change, so the signature stays recognizable while the surface cycles.</p>
      </footer>
    </main>
    <script>
      const signature = document.querySelector(".signature");
      const materials = ["glass", "extrude", "chalk", "paint"];
      const duration = 4200;
      const windowWidth = 36;
      const startedAt = performance.now();
      let lastMaterial = -1;

      function animateSignature(now) {
        const t = ((now - startedAt) % duration) / duration;
        const travel = Math.min(t / 0.82, 1);
        const start = travel * (100 - windowWidth);
        const end = start + windowWidth;
        const materialIndex = Math.min(Math.floor(t / 0.205), materials.length - 1);

        signature.style.setProperty("--scan-start", `${start}%`);
        signature.style.setProperty("--scan-end", `${end}%`);
        signature.style.setProperty("--spark-x", `${start * 0.92}%`);
        signature.style.setProperty("--flash-x", `${start - 8}%`);

        if (materialIndex !== lastMaterial) {
          signature.dataset.material = materials[materialIndex];
          signature.classList.add("is-cutting");
          window.setTimeout(() => signature.classList.remove("is-cutting"), 72);
          lastMaterial = materialIndex;
        }

        requestAnimationFrame(animateSignature);
      }

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        signature.dataset.material = "glass";
        signature.style.setProperty("--scan-start", "0%");
        signature.style.setProperty("--scan-end", "100%");
      } else {
        requestAnimationFrame(animateSignature);
      }
    </script>
  </body>
</html>
